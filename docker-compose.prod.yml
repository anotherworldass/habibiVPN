# 生产环境：API + Web + TG Mini App + Admin
# 由 scripts/deploy-prod.sh 按 blue/green 两套端口拉起，OpenResty reload 后切流量。
#
# MySQL / Redis 用本机。API 走桥接网络，入口脚本会把 127.0.0.1 改成 host.docker.internal：
#   DATABASE_URL=mysql://user:pass@127.0.0.1:3306/habibivpn
#   REDIS_URL=redis://127.0.0.1:6379

services:
  api:
    image: habibivpn-api:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    volumes:
      - habibi_support_uploads:/app/apps/api/data/support-uploads
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: habibivpn-web:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      HABIBI_API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  tg:
    image: habibivpn-tg:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: tg
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3002"
      HABIBI_API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:${TG_HOST_PORT:-3002}:3002"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  admin:
    image: habibivpn-admin:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8000}:80"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy

volumes:
  habibi_support_uploads:
    name: habibivpn_habibi_support_uploads
