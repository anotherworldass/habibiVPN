# 生产环境：API + Web + TG Mini App + Admin
# 由 scripts/deploy-prod.sh 按 blue/green 两套端口拉起，OpenResty reload 后切流量。
#
# MySQL / Redis 用本机，且通常只听 127.0.0.1，所以 API 走 host 网络：
#   DATABASE_URL=mysql://user:pass@127.0.0.1:3306/habibivpn
#   REDIS_URL=redis://127.0.0.1:6379
# web / tg / admin 经 api-gw（compose 别名 api）转到本槽 API 端口。

# 值来自 --env-file 指定的 .env（见 scripts/deploy-prod.sh）。
# 四个服务共用 Dockerfile 的 build 阶段，这组 args 必须完全一致。
x-next-public-args: &next-public-args
  NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-}
  NEXT_PUBLIC_DOWNLOAD_URL: ${NEXT_PUBLIC_DOWNLOAD_URL:-}
  NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
  NEXT_PUBLIC_SUPPORT_TELEGRAM: ${NEXT_PUBLIC_SUPPORT_TELEGRAM:-}
  NEXT_PUBLIC_TG_BOT_USERNAME: ${NEXT_PUBLIC_TG_BOT_USERNAME:-}
  NEXT_PUBLIC_TWITTER_URL: ${NEXT_PUBLIC_TWITTER_URL:-}
  NEXT_PUBLIC_APP_STORE_URL: ${NEXT_PUBLIC_APP_STORE_URL:-}
  NEXT_PUBLIC_PLAY_STORE_URL: ${NEXT_PUBLIC_PLAY_STORE_URL:-}
  NEXT_PUBLIC_ANDROID_APK_URL: ${NEXT_PUBLIC_ANDROID_APK_URL:-}
  NEXT_PUBLIC_WINDOWS_URL: ${NEXT_PUBLIC_WINDOWS_URL:-}
  NEXT_PUBLIC_MACOS_URL: ${NEXT_PUBLIC_MACOS_URL:-}

services:
  api:
    image: habibivpn-api:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
      args: *next-public-args
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "${API_HOST_PORT:-3001}"
    volumes:
      - habibi_support_uploads:/app/apps/api/data/support-uploads
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.API_PORT||'3001'; fetch('http://127.0.0.1:'+p+'/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api-gw:
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST_PORT: ${API_HOST_PORT:-3001}
      NGINX_ENVSUBST_FILTER: API_HOST_PORT
    volumes:
      - ./deploy/nginx-api-gw.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "3001"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        aliases:
          - api

  web:
    image: habibivpn-web:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      args: *next-public-args
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      HABIBI_API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
      api-gw:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  tg:
    image: habibivpn-tg:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: tg
      args: *next-public-args
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3002"
      HABIBI_API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:${TG_HOST_PORT:-3002}:3002"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
      api-gw:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  admin:
    image: habibivpn-admin:prod
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: admin
      args: *next-public-args
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8000}:80"
    labels:
      habibi.slot: ${HABIBI_SLOT:-blue}
    depends_on:
      api:
        condition: service_healthy
      api-gw:
        condition: service_started

volumes:
  habibi_support_uploads:
    name: habibivpn_habibi_support_uploads
